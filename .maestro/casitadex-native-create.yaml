appId: com.designsbyfa.casitadex.dev
---
- launchApp
- tapOn: "Add Memory"
- assertVisible: "What do you want to remember?"
- tapOn: "What do you want to remember?"
- inputText: "Maestro QA memory 20261104"
- tapOn: "The answer (or add a photo)"
