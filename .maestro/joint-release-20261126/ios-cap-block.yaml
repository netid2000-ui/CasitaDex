appId: com.designsbyfa.casitadex.platformqa
name: iOS at-cap trash restore guard and read-only sharing
---
- tapOn: "Home"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Recently deleted"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: "Recently deleted"
- tapOn: "View recently deleted memories"
- tapOn: "Open photo memory QA Deleted Photo"
- tapOn: "Restore memory"
- scrollUntilVisible:
    element: "Free plan: restore requires an available slot.*"
    direction: DOWN
    timeout: 15000
    centerElement: true
- takeScreenshot: ios-cap-restore-blocked
- scrollUntilVisible:
    element: "Share memory.*"
    direction: UP
    timeout: 15000
    centerElement: true
- tapOn: "Share memory.*"
- assertVisible: "Share memory"
- scrollUntilVisible:
    element: "Name and description are included by default.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: ios-trash-share
