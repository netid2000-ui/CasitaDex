appId: com.designsbyfa.casitadex.platformqa
name: Build 5 iOS retained archive list and cancel removal
---
- assertVisible: "Verified Full v4 backup retained privately.*"
- tapOn: "Review saved backups on this device"
- scrollUntilVisible:
    element: "Remove saved backup.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: ios-retained
- tapOn: "Remove saved backup.*"
- assertVisible: "Remove this saved backup?"
- takeScreenshot: ios-remove-confirmation
- tapOn: "Cancel"
- assertVisible: "Remove saved backup.*"
- tapOn: "Close saved backup list"
- scrollUntilVisible:
    element: "Choose backup to review"
    direction: DOWN
    timeout: 15000
- tapOn: "Choose backup to review"
