appId: com.designsbyfa.casitadex.platformqa
name: New CD exact-source synthetic photo
---
- launchApp:
    clearState: false
- tapOn: "Find"
- tapOn: "Search memories.*"
- inputText: "FA Platform Filter 20x25x1"
- hideKeyboard
- tapOn: "Open regular memory FA Platform Filter.*"
- scrollUntilVisible:
    element: "Add Photo"
    direction: DOWN
    timeout: 15000
- tapOn: "Add Photo"
- tapOn: "Choose from Library"
