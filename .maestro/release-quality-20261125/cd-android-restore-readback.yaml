appId: com.designsbyfa.casitadex.recallqa
name: CD one-record synthetic v4 restore and photo readback
---
- assertVisible: "1 memories, 1 saved photos, no unfinished draft, 0 draft photos."
- scrollUntilVisible:
    element: "Confirm replace with reviewed backup"
    direction: DOWN
    timeout: 15000
- tapOn: "Confirm replace with reviewed backup"
- extendedWaitUntil:
    visible: "Full collection restored and verified."
    timeout: 20000
- tapOn: "Find"
- tapOn: "Search memories.*"
- inputText: "FA QA Filter 20x25x1 20261125"
- hideKeyboard
- tapOn: "Open photo memory FA QA Filter 20x25x1 20261125"
- assertVisible: "Open cover photo of FA QA Filter 20x25x1 20261125"
- tapOn: "Open cover photo of FA QA Filter 20x25x1 20261125"
- assertVisible: "Photo 1 of 1.*"
