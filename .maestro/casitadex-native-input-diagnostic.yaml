appId: com.designsbyfa.casitadex.dev
---
- launchApp
- runFlow:
    when:
      visible: "Resume Draft"
    commands:
      - tapOn: "Resume Draft"
- runFlow:
    when:
      visible: "The details that matter."
    commands:
      - tapOn: "Add Memory"
- runFlow:
    when:
      visible: "Continue Editing"
    commands:
      - tapOn: "Continue Editing"
- assertVisible: "What do you want to remember?"
- tapOn:
    point: "50%,38%"
- inputText: "Native input diagnostic 20261104"
- takeScreenshot: casitadex-native-title-entered
- assertVisible: "Native input diagnostic 20261104"
