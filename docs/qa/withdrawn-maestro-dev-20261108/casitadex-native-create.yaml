appId: com.designsbyfa.casitadex.dev
---
- launchApp
- runFlow:
    when:
      visible: "Resume Draft"
    commands:
      - tapOn: "Resume Draft"
- runFlow:
    when:
      visible: "The details that matter."
    commands:
      - tapOn: "Add Memory"
- runFlow:
    when:
      visible: "Continue Editing"
    commands:
      - tapOn: "Continue Editing"
- assertVisible: "What do you want to remember?"
- tapOn:
    point: "50%,38%"
- inputText: "Maestro QA memory 20261104"
- tapOn:
    point: "50%,49%"
- inputText: "Maestro native answer"
- hideKeyboard
- scrollUntilVisible:
    element: "Save memory"
    direction: DOWN
- tapOn: "Save memory"
- assertVisible: "Maestro native answer"
