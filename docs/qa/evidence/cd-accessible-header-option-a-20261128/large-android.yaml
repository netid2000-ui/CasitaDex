appId: com.designsbyfa.casitadex.platformqa
name: Enlarged text scrolls Add and filters above alert controls; toggle works
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Find a memory"
    timeout: 20000
- tapOn: "Reminders"
- scrollUntilVisible:
    element: "Alert settings.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Alert settings.*"
- swipe:
    start: 50%,70%
    end: 50%,40%
    duration: 650
- scrollUntilVisible:
    element: "Show notification titles: Off"
    direction: DOWN
    timeout: 20000
- tapOn: "Show notification titles: Off"
- extendedWaitUntil:
    visible: "Show notification titles: On"
    timeout: 30000
- tapOn: "Show notification titles: On"
- extendedWaitUntil:
    visible: "Show notification titles: Off"
    timeout: 30000
- scrollUntilVisible:
    element: "Check device alerts"
    direction: DOWN
    timeout: 20000
- assertVisible: "Home"
- assertVisible: "Photos"
- assertVisible: "Reminders"
- assertVisible: "Find"
- takeScreenshot: CD-accessible-scroll
