appId: com.designsbyfa.casitadex.platformqa
name: Samsung non-destructive over-limit backup review
---
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Backup & restore"
    direction: DOWN
    timeout: 20000
- tapOn: "Backup & restore"
- scrollUntilVisible:
    element: "Choose backup to review"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: "Choose backup to review"
