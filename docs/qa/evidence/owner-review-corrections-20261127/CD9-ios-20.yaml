appId: com.designsbyfa.casitadex.platformqa
name: iOS Build 9 Free restore 20 counted memories and photo
---
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: "Backup checked. Review before replacing your collection."
    timeout: 20000
- scrollUntilVisible:
    element: "Active: 20; Archived: 0; Recently Deleted: .*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: CD9-android-20-preview
- scrollUntilVisible:
    element: "Confirm replace with reviewed backup"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    text: "Use backed-up draft.*"
    optional: true
- tapOn: "Confirm replace with reviewed backup"
- extendedWaitUntil:
    visible: "Full collection restored and verified."
    timeout: 20000
- takeScreenshot: CD9-android-20-restored
