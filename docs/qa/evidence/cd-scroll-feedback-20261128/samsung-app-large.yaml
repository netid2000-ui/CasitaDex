appId: com.designsbyfa.casitadex.platformqa
name: Standard reminder feedback scrolls and privacy toggle remains operable
---
- tapOn: "Large text"
- tapOn: "Reminders"
- tapOn: "Alert settings.*"
- swipe:
    start: 50%,70%
    end: 50%,40%
    duration: 650
- scrollUntilVisible:
    element: "Show notification titles: Off"
    direction: DOWN
    timeout: 20000
- tapOn: "Show notification titles: Off"
- extendedWaitUntil:
    visible: "Show notification titles: On"
    timeout: 30000
- tapOn: "Show notification titles: On"
- extendedWaitUntil:
    visible: "Show notification titles: Off"
    timeout: 30000
- scrollUntilVisible:
    element: "Reminder update"
    direction: DOWN
    timeout: 20000
- assertVisible: "Saved locally.*"
- assertVisible: "Home"
- assertVisible: "Photos"
- assertVisible: "Reminders"
- assertVisible: "Find"
- takeScreenshot: CD-scroll-feedback-standard
