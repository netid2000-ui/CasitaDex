appId: com.designsbyfa.casitadex.platformqa
name: Enlarged reminder feedback scrolls and privacy toggle remains operable
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Find a memory"
    timeout: 20000
- tapOn:
    point: "62%,91%"
- tapOn: "Alert settings.*"
- swipe:
    start: 50%,70%
    end: 50%,40%
    duration: 650
- scrollUntilVisible:
    element: "Show notification titles: Off"
    direction: DOWN
    timeout: 20000
