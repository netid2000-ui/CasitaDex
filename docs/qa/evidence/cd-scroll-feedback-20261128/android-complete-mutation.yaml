appId: com.designsbyfa.casitadex.platformqa
name: Complete only the synthetic reminder; actual scheduler result remains visible
---
- tapOn:
    point: "15%,63%"
- extendedWaitUntil:
    visible: "Reminder update"
    timeout: 20000
- assertVisible: "Saved locally. Alerts queued for 2 of 2 reminders.*"
- assertVisible: "Completed (1)"
- tapOn: "Completed (1)"
- scrollUntilVisible:
    element: "Edit QA Feedback Mutation 20261128"
    direction: DOWN
    timeout: 20000
- assertVisible: "Edit QA Feedback Mutation 20261128"
- assertVisible: "Restore"
