appId: com.designsbyfa.casitadex.platformqa
name: Synthetic daily reminder actual device queue on Android
---
- launchApp:
    clearState: false
- tapOn: "Reminders"
- tapOn: "Add Reminder"
- tapOn: "Reminder title.*"
- inputText: "QA Policy Daily Queue Android"
- hideKeyboard
- tapOn: "More options.*"
- tapOn: "Daily"
- tapOn: "Save Reminder"
- tapOn:
    text: "Allow"
    optional: true
- scrollUntilVisible:
    element: "QA Policy Daily Queue Android"
    direction: DOWN
    timeout: 20000
- assertVisible: "Alert queued through.*"
- takeScreenshot: CD-queued-reminder
