appId: com.designsbyfa.casitadex.platformqa
name: Synthetic daily reminder actual device queue on iOS
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Find a memory"
    timeout: 20000
- tapOn:
    point: "61%,92%"
- tapOn: "Add Reminder.*"
- tapOn: "Reminder title.*"
- inputText: "QA Policy Daily Queue iOS"
- hideKeyboard
- tapOn: "More options.*"
- tapOn: "Daily"
- tapOn: "Save Reminder"
- tapOn:
    text: "Allow"
    optional: true
- scrollUntilVisible:
    element: "QA Policy Daily Queue iOS"
    direction: DOWN
    timeout: 20000
- assertVisible: "Alert queued through.*"
- takeScreenshot: CD-queued-reminder
