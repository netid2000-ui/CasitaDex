name: CasitaDex prototype quality
on:
  push:
    branches:
      - main
      - governance/mac-mini-authority-*
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: casitadex-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run doctor
      - run: npm run export:web
# No deploy, submit, EAS build, credentials, Firebase or emulator job.
# Native/emulator QA remains explicit and separately authorized.
